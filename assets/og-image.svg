<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Improva — Earn your screen time. Train first.">
  <!-- Generated placeholder social share image (1200x630). Note: a PNG export is safest for social scrapers — see README TODO. -->
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1720"/>
      <stop offset="1" stop-color="#1b2430"/>
    </linearGradient>
    <linearGradient id="og-mark" x1="120" y1="215" x2="320" y2="415" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D353"/>
      <stop offset="1" stop-color="#5B5FEF"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 80) rotate(130) scale(560 560)">
      <stop stop-color="#5B5FEF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B5FEF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Brand mark -->
  <g transform="translate(96 215)">
    <rect width="200" height="200" rx="44" fill="url(#og-mark)"/>
    <rect x="57" y="95" width="86" height="66" rx="12" fill="#ffffff"/>
    <path d="M73 95v-15a27 27 0 0 1 54 0v15" stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none"/>
    <g fill="#5B5FEF">
      <rect x="95" y="118" width="10" height="20" rx="3"/>
      <rect x="83" y="121" width="8" height="14" rx="3"/>
      <rect x="109" y="121" width="8" height="14" rx="3"/>
      <rect x="91" y="126" width="18" height="4" rx="2"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="96" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#ffffff">Improva</text>
  <text x="96" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#39D353">Earn your screen time. Train first.</text>
  <text x="500" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Accountability-first fitness</text>
  <text x="500" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#c3ccd6">Running coach · strength · cardio · nutrition</text>
  <text x="500" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#c3ccd6">Private by design — all on your device</text>
</svg>
